<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#19181e"><title>Hand Analysis — Street Sync Prototype</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#ededf0;background:#19181e;--bg:#19181e;--card:#24242b;--muted:#8b8b9c;--green:#38e1a0;--blue:#32a1e9}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}.app{height:100dvh;max-width:500px;margin:auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}.status{height:28px;flex-shrink:0;padding:9px 18px 0;display:flex;justify-content:space-between;align-items:center}.dots{font-size:14px;letter-spacing:2px}.system{font-size:14px;letter-spacing:2px}.heading{height:61px;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;font-size:22px;font-weight:650}.back{position:absolute;left:21px;color:#85849d;border:0;background:none;font-size:35px;line-height:1}.reset{position:absolute;right:18px;border:0;background:none;color:#b0b0bd;font-size:13px;font-weight:600;padding:9px 0}.table-area{height:clamp(240px,35.5dvh,365px);flex-shrink:0;position:relative;margin:0 14px;background:linear-gradient(180deg,#19191f,#202127);border-radius:5px;overflow:hidden}.felt{position:absolute;left:6%;right:6%;top:16%;height:64%;border-radius:48%/46%;border:10px solid #0b302b;box-shadow:0 0 0 2px #253c3b,inset 0 0 0 2px #176455;background:radial-gradient(ellipse at 50% 42%,#11735a,#07533f 72%,#043d31);}.felt:after{content:"";position:absolute;inset:6px;border:1px dashed #46b09466;border-radius:inherit}.pot{position:absolute;top:38%;left:0;right:0;text-align:center;font-weight:700;font-size:14px;text-shadow:0 1px 2px #000}.community{position:absolute;top:45%;left:0;right:0;display:flex;gap:4px;justify-content:center}.playing-card{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;background:#f9faf8;border:1px solid #c9cfcc;border-radius:4px;width:31px;height:42px;line-height:1.03;font-weight:900;color:#171718;box-shadow:0 1px 2px #0005}.playing-card .rank{font-size:23px}.playing-card .suit{font-size:19px}.playing-card.red{color:#ef2f24}.playing-card.green{color:#3c912c}.playing-card.blue{color:#3b63e8}.playing-card.hidden{opacity:0;transform:scale(.8)}.playing-card.reveal{animation:flip .4s ease both}@keyframes flip{from{opacity:0;transform:rotateY(80deg) scale(.9)}to{opacity:1;transform:rotateY(0deg)}}.seat{position:absolute;display:flex;flex-direction:column;align-items:center;width:69px;transform:translate(-50%,-50%);opacity:.54;transition:opacity .2s,filter .2s}.seat.active{opacity:1;filter:drop-shadow(0 0 8px #15e99e99)}.seat.hero{opacity:1}.seat .pos{font-size:10px;color:#a9a9bb}.avatar{height:35px;width:35px;border:2px solid #414256;border-radius:50%;background:#17191e;display:grid;place-items:center}.avatar:before{content:"";width:16px;height:16px;background:#343541;border-radius:50%;box-shadow:0 14px 0 5px #343541;clip-path:circle(50%)}.seat .name{width:65px;min-height:22px;border:1px solid #383844;border-radius:3px;background:#191920eb;text-align:center;font-size:10px;color:#888898;line-height:1.1;padding:2px 1px}.seat .name b{display:block;font-weight:500}.seat.hero .avatar{border-color:var(--green);background:#082d25}.seat.hero .avatar:before{display:none}.hero-cards{display:flex;gap:2px;position:absolute;z-index:2;top:21px}.hero-cards .playing-card{width:21px;height:29px;border-radius:2px}.hero-cards .rank{font-size:16px}.hero-cards .suit{font-size:12px}.seat.hero .name{margin-top:18px;color:#bdc1ca}.action-bubble{position:absolute;bottom:11%;left:50%;transform:translateX(-50%);padding:6px 11px;border:1px solid #30e3a0;background:#09251fdc;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;max-width:90%;transition:opacity .2s;z-index:4}.action-bubble.faded{opacity:0}.unit{position:absolute;bottom:7px;right:10px;color:#747484;font-size:12px}/* Chips move from the acting seat to a visible pot stack. */
.chip-layer{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}.moving-chip{position:absolute;width:18px;height:18px;border-radius:50%;border:3px dashed white;background:#14976b;box-shadow:0 2px 4px #0009, inset 0 0 0 2px #0f4d3b;transform:translate(-50%,-50%);will-change:left,top,opacity,transform;animation:chip-to-pot .7s cubic-bezier(.2,.7,.2,1) forwards}.moving-chip:nth-child(2){animation-delay:.08s;background:#286bc7;box-shadow:0 2px 4px #0009,inset 0 0 0 2px #143d78}.moving-chip:nth-child(3){animation-delay:.16s;background:#cb7430;box-shadow:0 2px 4px #0009,inset 0 0 0 2px #80451d}@keyframes chip-to-pot{0%{left:var(--from-x);top:var(--from-y);opacity:1;transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{left:50%;top:67%;opacity:0;transform:translate(-50%,-50%) scale(.7)}}.pot-chips{position:absolute;left:50%;top:67%;transform:translate(-50%,-50%);z-index:3;display:flex;align-items:center;justify-content:center;gap:0;pointer-events:none}.pot-chip{width:15px;height:15px;border-radius:50%;border:2px dashed #f1f5f2;background:#15996b;box-shadow:0 2px 3px #0009,inset 0 0 0 2px #0b5942;margin-left:-5px}.pot-chip:first-child{margin-left:0}.pot-chip:nth-child(2){background:#276cc0}.pot-chip:nth-child(3){background:#c47733}.seat.folded{opacity:.22!important;filter:grayscale(1)!important}.seat.folded .avatar,.seat.folded .name{filter:grayscale(1)}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 14px 9px;flex-shrink:0;background:#19181e;z-index:2}.tab{min-width:0;border:1px solid transparent;border-radius:4px;background:#222127;color:#898998;padding:10px 0;font-size:14px;font-weight:600}.tab.selected{border-color:#19a678;color:#41e5aa;background:#1f2425}.analysis-scroll{min-height:0;flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;scroll-behavior:smooth;padding:5px 14px 75px;scroll-padding-top:8px}.analysis-scroll::-webkit-scrollbar{display:none}.scorebar{min-height:88px;display:flex;gap:14px;align-items:center;border-bottom:1px solid #2a2930;margin-bottom:12px;padding:8px 6px 16px}.gauge{width:45%;position:relative;height:70px;display:flex;justify-content:center;align-items:end;padding-bottom:8px}.gauge:before{content:"";position:absolute;width:124px;height:62px;bottom:0;border:9px solid #353541;border-bottom:0;border-radius:90px 90px 0 0}.gauge:after{content:"";position:absolute;width:124px;height:62px;bottom:0;border:9px solid transparent;border-top-color:#12dcba;border-left-color:#246df3;border-right-color:#13d6c3;border-bottom:0;border-radius:90px 90px 0 0;transform:rotate(-6deg)}.gauge strong{font-size:31px;color:#27dce1;line-height:1}.gauge span{font-size:11px;color:#ddd}.gauge small{position:absolute;bottom:-12px;color:#86869a;font-size:10px}.verdict{flex:1}.verdict h2{margin:0 0 6px;color:#44e5a9;font-size:23px}.verdict p{font-size:11px;color:#9997a7;white-space:nowrap;margin:0}.toggle-line{display:flex;align-items:center;justify-content:flex-end;gap:10px;height:38px;margin-bottom:10px;color:#e5e5e9;font-size:13px}.switch{width:44px;height:25px;background:#292930;border:1px solid #51515d;border-radius:20px;padding:3px;display:flex;align-items:center}.switch:before{content:"";width:17px;height:17px;background:#626471;border-radius:50%;transition:transform .2s}.switch.on{background:#08664d;border-color:#1ba377}.switch.on:before{transform:translateX(18px);background:#43e5ad}.street-card{background:#25252c;border-radius:9px;margin:0 0 14px;overflow:hidden;scroll-margin-top:7px;box-shadow:0 1px 0 #ffffff06}.street-heading{height:45px;background:linear-gradient(100deg,#343849,#303039 65%,#2b2b32);display:flex;align-items:center;padding:0 15px;gap:10px;font-size:15px;font-weight:700}.street-heading .small-cards{display:flex;gap:3px}.small-cards .playing-card{width:22px;height:32px;border-radius:2px}.small-cards .rank{font-size:16px}.small-cards .suit{font-size:13px}.results-heading{color:#ffd275}.result-row{display:flex;align-items:center;gap:12px;padding:9px 15px;font-size:14px;font-weight:700}.result-row .pill{min-width:38px}.result-win{color:#38e1a0}.result-loss{color:#ff5364}.street-heading .total{margin-left:auto;font-size:17px;white-space:nowrap}.moves{padding:10px 14px 9px}.move{min-height:34px;display:flex;align-items:center;gap:10px;font-size:13px;color:#9b9aa9}.move.you{color:#3de19c}.pill{min-width:36px;text-align:center;border-radius:15px;background:#46475f;color:#a5a6bb;font-size:10px;font-weight:750;padding:3px 7px}.move.you .pill{background:linear-gradient(90deg,#238762,#308ecc);color:#f1faf8}.move .check{color:#3ae7a9}.move .foldgroup{display:flex;gap:3px;flex-wrap:wrap}.analysis-detail{margin:3px 0 12px 46px;background:#202026;border-left:2px solid #2bd49a;padding:9px 10px;font-size:11px;color:#a9b2b0;border-radius:0 5px 5px 0}.analysis-detail b{color:#39e4a0}.analysis-detail .bar{height:4px;background:#41414a;border-radius:5px;margin-top:8px;overflow:hidden}.analysis-detail .bar:after{content:"";display:block;height:100%;width:74%;background:#39df9b}.hint{color:#757584;text-align:center;font-size:11px;padding:0 0 12px}.home{position:absolute;bottom:5px;left:50%;width:120px;height:5px;transform:translateX(-50%);background:#f7f7f7;border-radius:5px;pointer-events:none}.phone-shell{position:relative;height:100%;max-width:500px;margin:auto}.flash{animation:flash .75s ease}@keyframes flash{0%,100%{box-shadow:0 1px 0 #ffffff06}35%{box-shadow:0 0 0 2px #22ca99}}
@media (max-height:690px){.status{height:18px;padding-top:2px}.heading{height:46px;font-size:19px}.table-area{height:clamp(215px,36dvh,300px)}.tabs{padding-top:5px;padding-bottom:5px}.tab{padding:8px 0}}
</style></head><body><div class="phone-shell"><main class="app"><div class="status"><span class="dots">●●●○○</span><span class="system">▂▄▆ ▰ ▣</span></div><header class="heading"><button class="back" aria-label="Back">‹</button>Hand Analysis<button class="reset" id="reset" aria-label="Reset page">Reset</button></header><section class="table-area" aria-label="Poker table"><div class="felt"></div><div class="pot-chips" aria-hidden="true"><span class="pot-chip"></span><span class="pot-chip"></span><span class="pot-chip"></span></div><div class="chip-layer" id="chip-layer" aria-hidden="true"></div><div id="seats"></div><div class="pot" id="pot">Pot: 103 BB</div><div class="community" id="board"></div><div class="unit">Unit: BB</div></section><nav class="tabs" aria-label="Poker street navigation"><button class="tab" data-street="preflop">Preflop</button><button class="tab" data-street="flop">Flop</button><button class="tab" data-street="turn">Turn</button><button class="tab" data-street="river">River</button></nav><section class="analysis-scroll" id="analysis-scroll" aria-label="Scrollable hand analysis"><div class="scorebar"><div class="gauge"><div><strong>85</strong><span> /100</span></div><small>GTO Score</small></div><div class="verdict"><h2>⌕ Perfect</h2><p>Win: 38 BB · EV Loss: 3.15 BB</p></div></div><div class="toggle-line"><span>Expand all</span><button id="expand" class="switch" role="switch" aria-checked="false" aria-label="Expand all analysis"></button></div><div id="street-container"></div><p class="hint">Tap a street to view its analysis on the table.</p></section></main><div class="home"></div></div>
<script>
const streets=[
 {id:'preflop',label:'Preflop',pot:'1.5',cards:[],actions:[['UTG','Raise 2.5 BB'],['HJ · CO · SB · UTG · UTG+1 · UTG+2 · LJ','Fold'],['BTN','Raise 8 BB',true,'✓✓'],['BB','Raise 20 BB'],['BTN','Call',true,'✓']],detail:'3-bet to 8 BB · Best action',best:'Raise 8 BB',ev:'0.00 BB'},
 {id:'flop',label:'Flop',pot:'43',cards:[0,1,2],actions:[['BB','Check'],['BTN','Check',true,'✓✓']],detail:'Check · Correct decision',best:'Check',ev:'0.00 BB'},
 {id:'turn',label:'Turn',pot:'43',cards:[0,1,2,3],actions:[['BB','Bet 15 BB'],['BTN','Call 15 BB',true,'✓']],detail:'Call 15 BB · Well played',best:'Call 15 BB',ev:'0.45 BB'},
 {id:'river',label:'River',pot:'73',cards:[0,1,2,3,4],actions:[['BB','Check'],['BTN','Bet 30 BB',true,'✓✓'],['BB','Call 30 BB']],detail:'Bet 30 BB · Perfect play',best:'Bet 30 BB',ev:'0.00 BB'}
];
const boardCards=[['Q','♥','red'],['8','♣','green'],['3','♦','blue'],['K','♦','blue'],['2','♠','']];
const seatInfo=[['UTG+1','Zero','100',36,8],['UTG+2','Komore…','100',64,8],['LJ','Shadow','100',89,27],['HJ','Gravit…','100',93,61],['CO','Cedar','100',73,84],['BTN','Hero','35',50,86],['SB','Neon B…','99.5',27,84],['BB','Velvet','65',8,61],['UTG','happy','97.5',11,27]];
const card=(v,s,c,cls='')=>`<span class="playing-card ${c} ${cls}"><span class="rank">${v}</span><span class="suit">${s}</span></span>`;
document.querySelector('#seats').innerHTML=seatInfo.map(([pos,name,bb,x,y])=>`<div class="seat ${pos==='BTN'?'hero':''}" data-seat="${pos}" style="left:${x}%;top:${y}%"><span class="pos">${pos}</span><div class="avatar">${pos==='BTN'?`<span class="hero-cards">${card('A','♠','')}${card('K','♣','green')}</span>`:''}</div><span class="name">${name}<b>${bb}</b></span></div>`).join('');
function renderStreetCards(){document.querySelector('#street-container').innerHTML=streets.map(st=>`<article class="street-card" id="section-${st.id}"><div class="street-heading"><span>${st.label}</span><span class="small-cards">${(st.cards.length?st.cards:[-1,-2]).map(i=>i<0?card(i===-1?'A':'K',i===-1?'♠':'♣',i===-1?'':'green'):card(...boardCards[i])).join('')}</span><span class="total">${st.pot} BB</span></div><div class="moves">${st.actions.map(([pos,action,you,check])=>`<div class="move ${you?'you':''}"><span class="pill">${pos}</span><span>${action}</span>${check?`<span class="check">${check}</span>`:''}</div>${you?`<div class="analysis-detail" hidden><b>${st.detail}</b><div>Best: ${st.best} · EV Loss ${st.ev}</div><div class="bar"></div></div>`:''}`).join('')}</div></article>`).join('')+`<article class="street-card results-card" id="section-results"><div class="street-heading results-heading">Results</div><div class="moves"><div class="result-row"><span class="pill">UTG</span><span class="result-loss">-2.5 BB</span></div><div class="result-row"><span class="pill" style="background:linear-gradient(90deg,#238762,#308ecc);color:white">BTN</span><span class="result-win">38 BB</span></div><div class="result-row"><span class="pill">BB</span><span class="result-loss">-35 BB</span></div></div></article>`}
renderStreetCards();
let selected=null,timerIds=[],token=0,expandAll=false;
const pane=document.getElementById('analysis-scroll');
function cleanup(){timerIds.forEach(clearTimeout);timerIds=[];token++;document.getElementById('chip-layer').replaceChildren();}
function showBoard(street,count=5){const n=streets.findIndex(s=>s.id===street);const countVisible=[0,3,4,5][n];document.getElementById('board').innerHTML=boardCards.map((c,i)=>card(...c,i<countVisible?'reveal':'hidden')).join('')}
function setStreet(id,{scroll=true,play=true}={}){const st=streets.find(s=>s.id===id);if(!st)return;const sameStreet=selected===id;selected=id;document.querySelectorAll('.tab').forEach(el=>{el.classList.toggle('selected',el.dataset.street===id);el.setAttribute('aria-current',el.dataset.street===id?'true':'false')});if(scroll){document.getElementById('section-'+id).scrollIntoView({behavior:'smooth',block:'start'});}if(play&&!sameStreet)playStreet(st);else if(!sameStreet){document.getElementById('pot').textContent='Pot: '+st.pot+' BB';showBoard(id);}}
function animateChips(pos){
 const seat=document.querySelector(`.seat[data-seat="${pos}"]`);
 if(!seat)return;
 const table=document.querySelector('.table-area').getBoundingClientRect();
 const rect=seat.getBoundingClientRect();
 const x=((rect.left+rect.width/2-table.left)/table.width*100).toFixed(2)+'%';
 const y=((rect.top+rect.height/2-table.top)/table.height*100).toFixed(2)+'%';
 const layer=document.getElementById('chip-layer');
 const flight=document.createElement('div');
 flight.style.cssText=`--from-x:${x};--from-y:${y};position:absolute;inset:0;pointer-events:none`;
 for(let i=0;i<3;i++){const chip=document.createElement('span');chip.className='moving-chip';flight.appendChild(chip);}
 layer.appendChild(flight);
 timerIds.push(setTimeout(()=>flight.remove(),1000));
}
function foldSeat(pos){const seat=document.querySelector(`.seat[data-seat="${pos}"]`);if(seat){seat.classList.add('folded');seat.classList.remove('active');}}
function showAction(pos,action){
 document.querySelectorAll('.seat').forEach(e=>e.classList.toggle('active',e.dataset.seat===pos&&!e.classList.contains('folded')));
 if(/fold/i.test(action)){
   // The combined fold row represents multiple individual seats.
   pos.split(/\s*·\s*/).forEach(foldSeat);
 }else if(/\b(raise|bet|call)\b/i.test(action)){
   animateChips(pos);
 }
}
function playStreet(st){
 cleanup();const t=token;const bubble=document.getElementById('action');
 document.querySelectorAll('.seat').forEach(e=>{e.classList.remove('active','folded');});
 // At the start of every postflop street the preflop folders remain folded.
 if(st.id!=='preflop') ['UTG','UTG+1','UTG+2','LJ','HJ','CO','SB'].forEach(foldSeat);
 document.querySelector('.seat[data-seat="BTN"]').classList.add('active');
 document.getElementById('pot').textContent='Pot: '+st.pot+' BB';showBoard(st.id);
 st.actions.forEach(([pos,action],i)=>{
   timerIds.push(setTimeout(()=>{
     if(t!==token)return;
     showAction(pos,action);
   },i*1050+180));
 });
 timerIds.push(setTimeout(()=>{
   if(t!==token)return;
   document.querySelectorAll('.seat').forEach(e=>e.classList.toggle('active',e.dataset.seat==='BTN'));
 },st.actions.length*1050+800));
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setStreet(b.dataset.street)));
document.getElementById('reset').addEventListener('click',()=>{
 cleanup();selected=null;
 document.querySelectorAll('.tab').forEach(el=>{el.classList.remove('selected');el.setAttribute('aria-current','false')});
 document.querySelectorAll('.seat').forEach(el=>el.classList.remove('active','folded'));
 ['UTG','UTG+1','UTG+2','LJ','HJ','CO','SB'].forEach(foldSeat);
 showBoard('river');document.getElementById('pot').textContent='Pot: 103 BB';
 expandAll=false;document.getElementById('expand').classList.remove('on');document.getElementById('expand').setAttribute('aria-checked','false');
 document.querySelectorAll('.analysis-detail').forEach(el=>el.hidden=true);
 pane.scrollTo({top:0,behavior:'smooth'});
});

document.querySelector('#expand').addEventListener('click',()=>{expandAll=!expandAll;document.querySelector('#expand').classList.toggle('on',expandAll);document.querySelector('#expand').setAttribute('aria-checked',String(expandAll));document.querySelectorAll('.analysis-detail').forEach(e=>e.hidden=!expandAll)});
// Scrolling the analysis pane never changes the selected street or table.
// Begin at the summary as in the supplied screenshot; user taps a tab to jump to a street.
showBoard('river');document.getElementById('pot').textContent='Pot: 103 BB';
['UTG','UTG+1','UTG+2','LJ','HJ','CO','SB'].forEach(foldSeat);
document.querySelectorAll('.seat').forEach(e=>e.classList.remove('active'));

</script></body></html>
